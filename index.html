<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PERLA</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#F6F0EA;
font-family:Arial,sans-serif;
}

/* Navbar */

nav{
display:flex;
justify-content:space-between;
align-items:center;
padding:30px 70px;
}

.logo{
font-size:38px;
letter-spacing:12px;
font-weight:300;
color:#AA8674;
}

nav ul{
display:flex;
gap:40px;
list-style:none;
}

nav a{
text-decoration:none;
color:#8F776A;
font-size:15px;
transition:.3s;
}

nav a:hover{
color:#AA8674;
}

/* Hero */

.hero{
height:85vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
}

.hero h1{
font-size:95px;
letter-spacing:18px;
color:#AA8674;
font-weight:300;
margin-bottom:20px;
}

.hero p{
font-size:18px;
color:#9A8579;
margin-bottom:35px;
}

button{
padding:15px 45px;
background:#AA8674;
color:white;
border:none;
border-radius:40px;
font-size:16px;
cursor:pointer;
transition:.3s;
}

button:hover{
background:#8d6f60;
}

</style>

</head>

<body>

<nav>

<div class="logo">
PERLA
</div>

<ul>
<li><a href="#">الرئيسية</a></li>
<li><a href="#">المنتجات</a></li>
<li><a href="#">من نحن</a></li>
<li><a href="#">تواصل</a></li>
</ul>

</nav>

<section class="hero">

<h1>PERLA</h1>

<p>
Luxury inspired by the beauty of pearls
</p>

<button>
تسوق الآن
</button>

</section>

</body>
</html>
